name: release

# Builds the self-contained, single-file WPF app and publishes the .exe to a
# GitHub Release. Two ways to trigger it, both from master:
#   1. Push a CalVer tag:  git tag v2026.8.1 && git push origin v2026.8.1
#   2. Run it manually from the Actions tab (workflow_dispatch), picking master.
#      The tag is then created from the version declared in the .csproj.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The .csproj <Version> is the single source of truth for CalVer. Reading
      # it here keeps the artifact name and the release tag correct whether the
      # run came from a tag push or a manual dispatch on master.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content AiUsageBar/AiUsageBar.csproj)
          $version = @($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "No <Version> found in AiUsageBar.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      # A tag that disagrees with the .csproj would ship an .exe whose internal
      # version does not match its release. Fail loudly instead.
      - name: Verify tag matches .csproj version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            throw "Tag ${{ github.ref_name }} does not match .csproj version ${{ steps.version.outputs.tag }}"
          }

      # The app is a wrapper around the Rust CLI, and requiring users to run
      # `cargo install` first made a fresh download useless. Build the CLI here
      # and embed it, so the released .exe works on a clean machine.
      - uses: dtolnay/rust-toolchain@stable

      # Deliberately unpinned: each release picks up the current upstream. The
      # contract check below is what makes that safe.
      - name: Build the bundled ai-usagebar CLI
        id: cli
        shell: pwsh
        run: |
          cargo install ai-usagebar --locked --root "$env:RUNNER_TEMP\cli"
          $exe = "$env:RUNNER_TEMP\cli\bin\ai-usagebar.exe"
          if (-not (Test-Path $exe)) { throw "cargo install did not produce $exe" }

          New-Item -ItemType Directory -Force AiUsageBar/Assets | Out-Null
          Copy-Item $exe AiUsageBar/Assets/ai-usagebar.exe

          $env:Path = "$env:RUNNER_TEMP\cli\bin;$env:Path"
          $cliVersion = (& ai-usagebar --version) -join ' '
          "cli_version=$cliVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Bundling $cliVersion"

      # Upstream ships fast and has broken this app's assumptions before. Verify
      # the CLI we are about to bundle still matches Interop.cs, and fail the
      # release rather than shipping a build that cannot read its own backend.
      - name: Verify the bundled CLI still matches the app's contract
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\cli\bin;$env:Path"
          ./scripts/check-cli-contract.ps1

      # Single self-contained .exe. The self-contained / single-file / RID flags
      # live here (publish time) only, because putting them in the .csproj would
      # force a RID on every `dotnet build` and break it.
      #
      # ReadyToRun precompiles the startup path (WPF, the WPF-UI dictionaries,
      # BAML parsing, System.Text.Json, Tomlyn) instead of JITting all of it on
      # first launch. It is the single largest lever on time-to-icon for a
      # self-contained WPF app. Trimming stays off: it is unsupported for WPF and
      # breaks XAML reflection.
      #
      # The other two flags more than pay for it. Measured on 8.0.30:
      #
      #   no R2R ......................................... 194 MB
      #   R2R ............................................ 254 MB
      #   R2R + compression + English-only resources ...... 88 MB
      #
      # Compression costs some decompression at every start, which is what R2R
      # buys back. Dropping the satellite languages costs nothing anyone will
      # notice: 15.5 MB of WPF error strings in 13 languages that a tray app
      # never displays.
      #
      # InvariantGlobalization is deliberately absent. It would save nothing:
      # on Windows the runtime uses the operating system's own ICU, so the
      # win-x64 runtime pack ships no icudt.dat to remove.
      - name: Publish (win-x64, self-contained, single-file)
        run: >
          dotnet publish AiUsageBar/AiUsageBar.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:EnableCompressionInSingleFile=true
          -p:SatelliteResourceLanguages=en
          -o publish

      - name: Rename .exe with version
        shell: pwsh
        run: |
          Copy-Item publish/ai-usagebar-win.exe `
            "ai-usagebar-win-${{ steps.version.outputs.tag }}-x64.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Which CLI went inside this build. Unpinned upstream means this line is
          # the only record of what a given release actually shipped.
          append_body: true
          body: |
            Bundled CLI: `${{ steps.cli.outputs.cli_version }}`
            No `cargo install` required, the executable is self-contained.
          files: |
            ai-usagebar-win-${{ steps.version.outputs.tag }}-x64.exe
            config.example.toml
            THIRD-PARTY-NOTICES.md
